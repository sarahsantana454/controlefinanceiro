    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-image: url('https://i.postimg.cc/25RZQCrJ/Design-sem-nome.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Quicksand', sans-serif;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(37, 49, 66, 0.1);
            pointer-events: none;
            z-index: 0;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px 30px 0 0;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 4px solid #CF8A4A;
            box-shadow: 0 5px 20px rgba(37, 49, 66, 0.2);
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo-icon {
            width: 70px;
            height: 70px;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid #CF8A4A;
            box-shadow: 0 4px 10px rgba(207, 138, 74, 0.3);
        }
        
        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .header h1 {
            font-family: 'Comfortaa', cursive;
            color: #253142;
            font-size: 2.2em;
        }
        
        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .data-atual {
            background: #f0f2f5;
            color: #253142;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 500;
        }
        
        .user-info {
            background: #CF8A4A;
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        
        .user-info:hover {
            background: #253142;
        }
        
        .user-logged {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #253142;
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
        }
        
        .user-logged span {
            font-weight: 500;
        }
        
        .btn-logout {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s ease;
        }
        
        .btn-logout:hover {
            background: #c0392b;
            transform: scale(1.05);
        }
        
        .tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 0 20px;
            gap: 5px;
            border-bottom: 2px solid #AF8E72;
            flex-wrap: wrap;
            overflow-x: auto;
        }
        
        .tab {
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            font-family: 'Montserrat Alternates', sans-serif;
            font-weight: 600;
            color: #666;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        .tab:hover {
            color: #CF8A4A;
            background: rgba(207, 138, 74, 0.1);
            border-radius: 20px 20px 0 0;
        }
        
        .tab.active {
            color: #CF8A4A;
            border-bottom-color: #CF8A4A;
        }
        
        .main-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 0 0 30px 30px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(37, 49, 66, 0.2);
            min-height: 500px;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* TELA DE LOGIN OBRIGATÓRIO */
        .login-required {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 30px;
            border: 2px solid #AF8E72;
            box-shadow: 0 5px 20px rgba(37, 49, 66, 0.1);
        }
        
        .login-required .lock-icon {
            font-size: 5em;
            margin-bottom: 20px;
            color: #CF8A4A;
        }
        
        .login-required h2 {
            font-family: 'Comfortaa', cursive;
            color: #253142;
            margin-bottom: 15px;
        }
        
        .login-required p {
            color: #666;
            margin-bottom: 30px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .login-required .btn-login {
            background: #CF8A4A;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .login-required .btn-login:hover {
            background: #253142;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        /* CARD PRINCIPAL DA PÁGINA INICIAL */
        .welcome-card {
            background: linear-gradient(135deg, #CF8A4A, #253142);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            color: white;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .welcome-card h2 {
            font-size: 2.5em;
            font-family: 'Comfortaa', cursive;
            margin-bottom: 20px;
        }
        
        .welcome-card p {
            font-size: 1.2em;
            max-width: 600px;
            margin: 0 auto 30px;
            opacity: 0.9;
        }
        
        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .stat-overview-item {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        .stat-overview-item .label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        
        .stat-overview-item .value {
            font-size: 2.5em;
            font-weight: 700;
            font-family: 'Comfortaa', cursive;
        }
        
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 40px;
        }
        
        .quick-action-btn {
            background: white;
            border: none;
            border-radius: 50px;
            padding: 20px;
            font-size: 1.1em;
            font-weight: 600;
            color: #253142;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .quick-action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            background: #CF8A4A;
            color: white;
        }
        
        /* CARDS DE RESUMO */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr) 1.2fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #AF8E72;
            box-shadow: 0 5px 15px rgba(37, 49, 66, 0.1);
        }
        
        .stat-label {
            color: #666;
            font-size: 0.85em;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .stat-value {
            font-size: 2.2em;
            font-weight: 600;
            color: #253142;
            line-height: 1.2;
        }
        
        /* META CARD */
        .meta-card {
            background: linear-gradient(135deg, #253142, #1a2533);
            border-radius: 20px;
            padding: 20px;
            color: white;
        }
        
        .meta-card input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 1.1em;
            margin: 10px 0;
        }
        
        .progress-container {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 12px;
        }
        
        .progress-bar {
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
            margin: 8px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: #CF8A4A;
            width: 0%;
            transition: width 0.3s;
        }
        
        /* SEÇÕES */
        .section {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #AF8E72;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Comfortaa', cursive;
            color: #253142;
        }
        
        .total-badge {
            background: #CF8A4A;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
        }
        
        /* INPUT GROUP */
        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .input-group input {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            border: 2px solid #AF8E72;
            border-radius: 15px;
            font-size: 1em;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .btn-primary { background: #CF8A4A; color: white; }
        .btn-success { background: #4CAF50; color: white; }
        .btn-danger { background: #f44336; color: white; }
        .btn-secondary { background: #253142; color: white; }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        /* MÊS CONTROLS */
        .month-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .month-selector {
            background: #f0f2f5;
            padding: 6px;
            border-radius: 30px;
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        
        .month-btn {
            padding: 8px 16px;
            border: none;
            background: transparent;
            border-radius: 25px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .month-btn.active {
            background: #CF8A4A;
            color: white;
        }
        
        /* TABELAS */
        .table-container {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            text-align: left;
            padding: 12px 8px;
            color: #888;
            font-weight: 500;
            font-size: 0.9em;
            border-bottom: 2px solid #eee;
        }
        
        td {
            padding: 12px 8px;
            border-bottom: 1px solid #f5f5f5;
        }
        
        input, select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #AF8E72;
            border-radius: 10px;
            font-size: 0.95em;
        }
        
        .checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #CF8A4A;
        }
        
        .btn-delete {
            background: transparent;
            color: #f44336;
            border: 1px solid #f44336;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .btn-delete:hover {
            background: #f44336;
            color: white;
        }
        
        .btn-add {
            background: #CF8A4A;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-add:hover {
            background: #253142;
        }
        
        /* GRÁFICOS */
        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .chart-card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid #AF8E72;
        }
        
        .chart-card h3 {
            color: #253142;
            margin-bottom: 15px;
        }
        
        .chart-container {
            height: 250px;
        }
        
        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(37, 49, 66, 0.5);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal.show { display: flex; }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 30px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        
        .modal-content h2 {
            font-family: 'Comfortaa', cursive;
            color: #253142;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: #253142;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #AF8E72;
            border-radius: 50px;
            font-size: 1em;
        }
        
        /* NOTIFICAÇÃO */
        .notificacao {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #253142;
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 2000;
        }
        
        .notificacao.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        /* CATEGORIAS */
        .categorias-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        
        .categoria-card {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 12px;
            border-left: 4px solid #CF8A4A;
        }
        
        .categoria-nome {
            font-weight: 600;
            color: #253142;
            margin-bottom: 4px;
        }
        
        .categoria-desc {
            color: #888;
            font-size: 0.9em;
        }
        
        /* RESPONSIVIDADE */
        @media (max-width: 1200px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .charts-row { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 768px) {
            .header { flex-direction: column; text-align: center; }
            .logo-container { justify-content: center; }
            .stats-grid { grid-template-columns: 1fr; }
            .month-controls { flex-direction: column; }
        }
        
        footer {
            text-align: center;
            margin-top: 20px;
            color: #253142;
            font-size: 0.95em;
            padding: 15px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <div class="logo-icon">

                <h1>Controle Financeiro</h1>
            </div>
            <div class="header-controls">
                <div class="data-atual" id="dataAtual"></div>

                    <div id="userLogged" class="user-logged" style="display: none;">
                        <span id="loggedName"></span>
                        <button class="btn-logout" onclick="logout()">Sair</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="mudarAba('inicio')">🏠 Início</div>

            <div class="tab" onclick="mudarAba('estatisticas')">📊 Estatísticas</div>

        <div class="main-card" id="mainContent">

        </div>
        
        <footer>💰 Controle Financeiro - Portugal • Cuidar do seu dinheiro é cuidar de você</footer>
    </div>
    
    <!-- MODAL LOGIN -->

            <h2>🔐 Criar conta / Entrar</h2>
            
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="seu@email.com" value="teste@email.com">
            </div>
            
            <div class="form-group">
                <label>Senha (mínimo 6 caracteres)</label>
                <input type="password" id="loginSenha" placeholder="********" value="123456">
            </div>
            
            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;">
                <button class="btn btn-success" onclick="criarConta()">📝 Criar Conta</button>
                <button class="btn btn-primary" onclick="fazerLogin()">🔑 Entrar</button>
            </div>
            
            <p style="color: #666; font-size: 0.9em; text-align: center;">
                ✅ Seus dados ficam salvos na nuvem e são privados da sua conta!
            </p>
            
            <button class="btn btn-secondary" onclick="fecharModal('login')" style="margin-top: 20px; width: 100%;">Fechar</button>
        </div>
    </div>
    
    <!-- NOTIFICAÇÃO -->
    <div class="notificacao" id="notificacao"></div>

        function criarConta() {
            const email = document.getElementById('loginEmail').value.trim();
            const senha = document.getElementById('loginSenha').value;
            
            if (!email || !senha) {
                mostrarNotificacao('❌ Preencha email e senha!');
                return;
            }
            
            if (senha.length < 6) {
                mostrarNotificacao('❌ Senha deve ter no mínimo 6 caracteres');
                return;
            }
            
            auth.createUserWithEmailAndPassword(email, senha)
                .then((userCredential) => {
                    const dadosIniciais = {};
                    MESES.forEach(mes => {
                        dadosIniciais[mes] = JSON.parse(JSON.stringify(DADOS_PADRAO));
                    });
                    
                    return db.collection('usuarios').doc(userCredential.user.uid).set(dadosIniciais);
                })
                .then(() => {
                    mostrarNotificacao('✅ Conta criada com sucesso!');
                    fecharModal('login');
                })
                .catch((error) => {
                    if (error.code === 'auth/email-already-in-use') {
                        mostrarNotificacao('❌ Este email já está em uso');
                    } else {
                        mostrarNotificacao('❌ Erro: ' + error.message);
                    }
                });
        }

            const email = document.getElementById('loginEmail').value.trim();
            const senha = document.getElementById('loginSenha').value;
            
            if (!email || !senha) {
                mostrarNotificacao('❌ Preencha email e senha!');
                return;
            }
            
            auth.signInWithEmailAndPassword(email, senha)
                .then(() => {
                    mostrarNotificacao('✅ Login realizado!');
                    fecharModal('login');
                })
                .catch((error) => {

                        mostrarNotificacao('❌ Usuário não encontrado');

        // ========== CÁLCULOS ==========
        function calcularTotais(dados) {
            if (!dados) dados = DADOS_PADRAO;
            
            const entradas = dados.entradas ? dados.entradas.reduce((s, i) => s + (Number(i.valor) || 0), 0) : 0;
            
            const fixos = dados.fixos ? dados.fixos.reduce((s, i) => s + (i.pago ? (Number(i.valor) || 0) : 0), 0) : 0;
            const variaveis = dados.variaveis ? dados.variaveis.reduce((s, i) => s + (Number(i.valor) || 0), 0) : 0;
            const cartao = dados.cartao ? dados.cartao.reduce((s, i) => s + (Number(i.valor) || 0), 0) : 0;
            
            const gastos = fixos + variaveis + cartao;
            const saldoBruto = entradas - gastos;
            const guardado = dados.guardado || 0;
            
            return {
                entradas,
                gastos,
                saldoDisponivel: saldoBruto - guardado,
                guardado
            };
        }

        function calcularReservaTotal() {
            let total = 0;
            MESES.forEach(mes => {
                if (dadosMeses[mes] && dadosMeses[mes].guardado) {
                    total += dadosMeses[mes].guardado;
                }
            });
            return total;
        }

        // ========== FUNÇÕES DOS MESES ==========
        function renderizarMeses() {
            const container = document.getElementById('monthSelector');
            if (!container) return;
            
            container.innerHTML = '';
            MESES.forEach(mes => {
                const btn = document.createElement('button');
                btn.className = `month-btn ${mes === mesAtual ? 'active' : ''}`;
                btn.textContent = mes;
                btn.onclick = () => {
                    mesAtual = mes;
                    renderizarMeses();
                    atualizarInterfaceMeses();
                };
                container.appendChild(btn);
            });
        }

        async function copiarMes() {
            const index = MESES.indexOf(mesAtual);
            if (index === 0) {
                mostrarNotificacao('❌ Janeiro não tem mês anterior');
                return;
            }
            
            const mesAnterior = MESES[index - 1];
            dadosMeses[mesAtual] = JSON.parse(JSON.stringify(dadosMeses[mesAnterior] || DADOS_PADRAO));
            await salvarDados();
            await atualizarInterfaceMeses();
            await atualizarInterfaceGeral();
            mostrarNotificacao(`✅ Dados copiados de ${mesAnterior}`);
        }

        async function resetarMes() {
            if (!confirm(`Resetar dados de ${mesAtual}?`)) return;
            
            dadosMeses[mesAtual] = JSON.parse(JSON.stringify(DADOS_PADRAO));
            await salvarDados();
            await atualizarInterfaceMeses();
            await atualizarInterfaceGeral();
            mostrarNotificacao(`🔄 ${mesAtual} resetado`);
        }

        // ========== FUNÇÕES CRUD ==========
        function atualizarInterfaceMeses() {
            const dados = getDadosMes();
            const totais = calcularTotais(dados);
            
            const totalEntradasEl = document.getElementById('totalEntradas');
            const totalGastosEl = document.getElementById('totalGastos');
            const saldoDisponivelEl = document.getElementById('saldoDisponivel');
            const totalGuardadoEl = document.getElementById('totalGuardado');
            
            if (totalEntradasEl) totalEntradasEl.textContent = formatarMoeda(totais.entradas);
            if (totalGastosEl) totalGastosEl.textContent = formatarMoeda(totais.gastos);
            if (saldoDisponivelEl) saldoDisponivelEl.textContent = formatarMoeda(totais.saldoDisponivel);
            if (totalGuardadoEl) totalGuardadoEl.textContent = formatarMoeda(totais.guardado);
            
            const meta = dados.meta || 500;
            const metaInput = document.getElementById('metaEconomia');
            const progressFill = document.getElementById('progressFill');
            const metaProgress = document.getElementById('metaProgress');
            
            if (metaInput) metaInput.value = meta;
            const percentual = meta > 0 ? Math.min(100, (totais.guardado / meta) * 100) : 0;
            if (progressFill) progressFill.style.width = percentual + '%';
            if (metaProgress) metaProgress.textContent = percentual.toFixed(1) + '%';
            
            atualizarTabela('entradas', dados.entradas || []);
            atualizarTabela('fixos', dados.fixos || []);
            atualizarTabela('variaveis', dados.variaveis || []);
            atualizarTabela('cartao', dados.cartao || []);
            
            const reservaTotalEl = document.getElementById('reservaTotal');
            if (reservaTotalEl) reservaTotalEl.textContent = formatarMoeda(calcularReservaTotal());
        }

        function atualizarTabela(tipo, lista) {
            const tbody = document.getElementById(tipo + 'Body');
            if (!tbody) return;
            
            let html = '';
            
            if (tipo === 'entradas') {
                lista.forEach((item, i) => {
                    html += `<tr>
                        <td><input value="${item.descricao || ''}" onchange="atualizarItem('entradas',${i},'descricao',this.value)"></td>
                        <td><input type="number" step="0.01" value="${item.valor || 0}" onchange="atualizarItem('entradas',${i},'valor',this.value)"></td>
                        <td>
                            <select onchange="atualizarItem('entradas',${i},'frequencia',this.value)">
                                <option value="Mensal" ${item.frequencia === 'Mensal' ? 'selected' : ''}>Mensal</option>
                                <option value="Extra" ${item.frequencia === 'Extra' ? 'selected' : ''}>Extra</option>
                            </select>
                        </td>
                        <td><button class="btn-delete" onclick="deletarItem('entradas',${i})">🗑️</button></td>
                    </tr>`;
                });
            }
            
            if (tipo === 'fixos') {
                lista.forEach((item, i) => {
                    html += `<tr>
                        <td><input value="${item.descricao || ''}" onchange="atualizarItem('fixos',${i},'descricao',this.value)"></td>
                        <td><input type="number" step="0.01" value="${item.valor || 0}" onchange="atualizarItem('fixos',${i},'valor',this.value)"></td>
                        <td>
                            <select onchange="atualizarItem('fixos',${i},'categoria',this.value)">
                                ${CATEGORIAS.map(c => `<option value="${c.nome}" ${item.categoria === c.nome ? 'selected' : ''}>${c.nome}</option>`).join('')}
                            </select>
                        </td>
                        <td><input type="checkbox" class="checkbox" ${item.pago ? 'checked' : ''} onchange="atualizarItem('fixos',${i},'pago',this.checked)"></td>
                        <td><button class="btn-delete" onclick="deletarItem('fixos',${i})">🗑️</button></td>
                    </tr>`;
                });
            }
            
            if (tipo === 'variaveis') {
                lista.forEach((item, i) => {
                    const hoje = new Date().toISOString().split('T')[0];
                    html += `<tr>
                        <td><input value="${item.descricao || ''}" onchange="atualizarItem('variaveis',${i},'descricao',this.value)"></td>
                        <td><input type="number" step="0.01" value="${item.valor || 0}" onchange="atualizarItem('variaveis',${i},'valor',this.value)"></td>
                        <td>
                            <select onchange="atualizarItem('variaveis',${i},'categoria',this.value)">
                                ${CATEGORIAS.map(c => `<option value="${c.nome}" ${item.categoria === c.nome ? 'selected' : ''}>${c.nome}</option>`).join('')}
                            </select>
                        </td>
                        <td><input type="date" value="${item.data || hoje}" onchange="atualizarItem('variaveis',${i},'data',this.value)"></td>
                        <td><button class="btn-delete" onclick="deletarItem('variaveis',${i})">🗑️</button></td>
                    </tr>`;
                });
            }
            
            if (tipo === 'cartao') {
                lista.forEach((item, i) => {
                    const hoje = new Date().toISOString().split('T')[0];
                    html += `<tr>
                        <td><input value="${item.descricao || ''}" onchange="atualizarItem('cartao',${i},'descricao',this.value)"></td>
                        <td><input type="number" step="0.01" value="${item.valor || 0}" onchange="atualizarItem('cartao',${i},'valor',this.value)"></td>
                        <td>
                            <select onchange="atualizarItem('cartao',${i},'categoria',this.value)">
                                ${CATEGORIAS.map(c => `<option value="${c.nome}" ${item.categoria === c.nome ? 'selected' : ''}>${c.nome}</option>`).join('')}
                            </select>
                        </td>
                        <td><input type="number" min="1" value="${item.parcelas || 1}" onchange="atualizarItem('cartao',${i},'parcelas',this.value)"></td>
                        <td><input type="date" value="${item.data || hoje}" onchange="atualizarItem('cartao',${i},'data',this.value)"></td>
                        <td><button class="btn-delete" onclick="deletarItem('cartao',${i})">🗑️</button></td>
                    </tr>`;
                });
            }
            
            tbody.innerHTML = html;
        }

        async function atualizarItem(tipo, index, campo, valor) {
            const dados = getDadosMes();
            
            if (campo === 'pago') {
                dados[tipo][index][campo] = valor;
            } else if (campo === 'valor' || campo === 'parcelas') {
                dados[tipo][index][campo] = Number(valor) || 0;
            } else {
                dados[tipo][index][campo] = valor;
            }
            
            await salvarDadosMes(dados);
        }

        async function deletarItem(tipo, index) {
            if (!confirm('Remover este item?')) return;
            
            const dados = getDadosMes();
            dados[tipo].splice(index, 1);
            await salvarDadosMes(dados);
        }

        async function adicionarEntrada() {
            const dados = getDadosMes();
            if (!dados.entradas) dados.entradas = [];
            dados.entradas.push({ descricao: 'Nova entrada', valor: 0, frequencia: 'Mensal' });
            await salvarDadosMes(dados);
        }

        async function adicionarFixo() {
            const dados = getDadosMes();
            if (!dados.fixos) dados.fixos = [];
            dados.fixos.push({ descricao: 'Novo fixo', valor: 0, categoria: 'Contas', pago: false });
            await salvarDadosMes(dados);
        }

        async function adicionarVariavel() {
            const dados = getDadosMes();
            if (!dados.variaveis) dados.variaveis = [];
            const hoje = new Date().toISOString().split('T')[0];
            dados.variaveis.push({ descricao: 'Novo variável', valor: 0, categoria: 'Mercado', data: hoje });
            await salvarDadosMes(dados);
        }

        async function adicionarCartao() {
            const dados = getDadosMes();
            if (!dados.cartao) dados.cartao = [];
            const hoje = new Date().toISOString().split('T')[0];
            dados.cartao.push({ descricao: 'Nova compra', valor: 0, categoria: 'Eletrônicos', parcelas: 1, data: hoje });
            await salvarDadosMes(dados);
        }

        async function guardarDinheiro() {
            const valor = Number(document.getElementById('valorGuardar').value);
            if (!valor || valor <= 0) {
                mostrarNotificacao('❌ Digite um valor válido');
                return;
            }
            
            const dados = getDadosMes();
            const totais = calcularTotais(dados);
            
            if (valor > totais.saldoDisponivel) {
                mostrarNotificacao('❌ Saldo insuficiente');
                return;
            }
            
            dados.guardado = (dados.guardado || 0) + valor;
            await salvarDadosMes(dados);
            document.getElementById('valorGuardar').value = '';
        }

        async function atualizarMeta() {
            const dados = getDadosMes();
            dados.meta = Number(document.getElementById('metaEconomia').value) || 500;
            await salvarDadosMes(dados);
        }

        async function atualizarMetaGeral() {
            const valor = Number(document.getElementById('metaGeral').value) || 500;
            MESES.forEach(mes => {
                if (dadosMeses[mes]) {
                    dadosMeses[mes].meta = valor;
                }
            });
            await salvarDados();
            await atualizarInterfaceGeral();
        }

        // ========== INTERFACE GERAL ==========
        function atualizarInterfaceGeral() {
            let totalEntradas = 0, totalGastos = 0, totalSaldo = 0, totalGuardado = 0;
            let mesesAtivos = 0;
            
            MESES.forEach(mes => {
                const dados = dadosMeses[mes] || DADOS_PADRAO;
                const totais = calcularTotais(dados);
                totalEntradas += totais.entradas;
                totalGastos += totais.gastos;
                totalSaldo += totais.saldoDisponivel;
                totalGuardado += totais.guardado;
                if (totais.entradas > 0 || totais.gastos > 0) mesesAtivos++;
            });
            
            const totalEntradasGeral = document.getElementById('totalEntradasGeral');
            const totalGastosGeral = document.getElementById('totalGastosGeral');
            const saldoDisponivelGeral = document.getElementById('saldoDisponivelGeral');
            const guardadoGeral = document.getElementById('guardadoGeral');
            const reservaTotalInicio = document.getElementById('reservaTotalInicio');
            const mesesAtivosEl = document.getElementById('mesesAtivos');
            
            if (totalEntradasGeral) totalEntradasGeral.textContent = formatarMoeda(totalEntradas);
            if (totalGastosGeral) totalGastosGeral.textContent = formatarMoeda(totalGastos);
            if (saldoDisponivelGeral) saldoDisponivelGeral.textContent = formatarMoeda(totalSaldo);
            if (guardadoGeral) guardadoGeral.textContent = formatarMoeda(totalGuardado);
            if (reservaTotalInicio) reservaTotalInicio.textContent = formatarMoeda(totalGuardado);
            if (mesesAtivosEl) mesesAtivosEl.textContent = mesesAtivos;
            
            const metaGeral = document.getElementById('metaGeral');
            const progressFillGeral = document.getElementById('progressFillGeral');
            const metaProgressGeral = document.getElementById('metaProgressGeral');
            
            if (metaGeral) {
                const meta = Number(metaGeral.value) || 500;
                const percentual = meta > 0 ? Math.min(100, (totalGuardado / meta) * 100) : 0;
                if (progressFillGeral) progressFillGeral.style.width = percentual + '%';
                if (metaProgressGeral) metaProgressGeral.textContent = percentual.toFixed(1) + '%';
            }
            
            atualizarEstatisticas();
        }

        function atualizarEstatisticas() {
            let totalGastos = 0;
            let mesesComGasto = 0;
            let maiorEconomia = 0;
            let mesMaisEconomico = '';
            let totalGuardado = 0;
            
            MESES.forEach(mes => {
                const dados = dadosMeses[mes] || DADOS_PADRAO;
                const totais = calcularTotais(dados);
                totalGastos += totais.gastos;
                if (totais.gastos > 0) mesesComGasto++;
                
                const guardado = dados.guardado || 0;
                totalGuardado += guardado;
                
                if (guardado > maiorEconomia) {
                    maiorEconomia = guardado;
                    mesMaisEconomico = mes;
                }
            });
            
            const mediaMensal = mesesComGasto > 0 ? totalGastos / mesesComGasto : 0;
            
            document.getElementById('mediaMensal') && (document.getElementById('mediaMensal').textContent = formatarMoeda(mediaMensal));
            document.getElementById('mesEconomico') && (document.getElementById('mesEconomico').textContent = mesMaisEconomico || '-');
            
            const meta = Number(document.getElementById('metaGeral')?.value) || 500;
            const percentualMeta = meta > 0 ? (totalGuardado / meta) * 100 : 0;
            document.getElementById('metaAtingida') && (document.getElementById('metaAtingida').textContent = percentualMeta.toFixed(1) + '%');
        }

        function atualizarGraficos() {
            const dados = getDadosMes();
            
            const ctxPizza = document.getElementById('graficoPizza')?.getContext('2d');
            if (ctxPizza) {
                let categorias = {};
                CATEGORIAS.forEach(c => categorias[c.nome] = 0);
                
                if (dados.fixos) {
                    dados.fixos.filter(f => f.pago).forEach(item => {
                        categorias[item.categoria] = (categorias[item.categoria] || 0) + (Number(item.valor) || 0);
                    });
                }
                
                if (dados.variaveis) {
                    dados.variaveis.forEach(item => {
                        categorias[item.categoria] = (categorias[item.categoria] || 0) + (Number(item.valor) || 0);
                    });
                }
                
                if (dados.cartao) {
                    dados.cartao.forEach(item => {
                        categorias[item.categoria] = (categorias[item.categoria] || 0) + (Number(item.valor) || 0);
                    });
                }
                
                const dadosPizza = Object.entries(categorias).filter(([_, v]) => v > 0);
                
                if (graficoPizza) graficoPizza.destroy();
                if (dadosPizza.length > 0) {
                    graficoPizza = new Chart(ctxPizza, {
                        type: 'doughnut',
                        data: {
                            labels: dadosPizza.map(([n]) => n),
                            datasets: [{
                                data: dadosPizza.map(([_, v]) => v),
                                backgroundColor: ['#CF8A4A', '#253142', '#AF8E72', '#8B6B4F', '#5D4A36']
                            }]
                        },
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false,
                            cutout: '65%',
                            plugins: { legend: { position: 'bottom' } }
                        }
                    });
                }
            }
            
            const ctxBarras = document.getElementById('graficoBarras')?.getContext('2d');
            if (ctxBarras) {
                const fixosPagos = dados.fixos ? dados.fixos.reduce((s, i) => s + (i.pago ? (Number(i.valor) || 0) : 0), 0) : 0;
                const variaveis = dados.variaveis ? dados.variaveis.reduce((s, i) => s + (Number(i.valor) || 0), 0) : 0;
                const cartao = dados.cartao ? dados.cartao.reduce((s, i) => s + (Number(i.valor) || 0), 0) : 0;
                
                if (graficoBarras) graficoBarras.destroy();
                graficoBarras = new Chart(ctxBarras, {
                    type: 'bar',
                    data: {
                        labels: ['Débito', 'Crédito'],
                        datasets: [{
                            data: [fixosPagos + variaveis, cartao],
                            backgroundColor: ['#253142', '#CF8A4A']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true } }
                    }
                });
            }
        }

        function renderizarCategorias() {
            const grid = document.getElementById('categoriasGrid');
            if (!grid) return;
            
            grid.innerHTML = CATEGORIAS.map(c => `
                <div class="categoria-card">
                    <div class="categoria-nome">${c.icone} ${c.nome}</div>
                    <div class="categoria-desc">${c.descricao}</div>
                </div>
            `).join('');
        }

        // ========== BACKUP ==========
        function exportarBackup() {
            const backup = dadosMeses;
            const blob = new Blob([JSON.stringify(backup)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `backup-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            mostrarNotificacao('📥 Backup exportado!');
        }

        function importarBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const backup = JSON.parse(e.target.result);
                    dadosMeses = backup;
                    await salvarDados();
                    await atualizarInterfaceGeral();
                    await atualizarInterfaceMeses();
                    renderizarMeses();
                    mostrarNotificacao('✅ Backup restaurado!');
                } catch {
                    mostrarNotificacao('❌ Arquivo inválido!');
                }
            };
            reader.readAsText(file);
        }

        async function resetarTudo() {
            if (!confirm('⚠️ Isso apagará TODOS os seus dados! Tem certeza?')) return;
            if (!confirm('ÚLTIMA CHANCE! Tem CERTEZA?')) return;
            
            dadosMeses = {};
            MESES.forEach(mes => {
                dadosMeses[mes] = JSON.parse(JSON.stringify(DADOS_PADRAO));
            });
            await salvarDados();
            await atualizarInterfaceGeral();
            await atualizarInterfaceMeses();
            renderizarMeses();
            mostrarNotificacao('🗑️ Todos os dados resetados');
        }

        // ========== INICIALIZAR ==========
        auth.onAuthStateChanged((user) => {
            renderizarConteudo();
        });

        window.onclick = (e) => {
            if (e.target.classList.contains('modal')) e.target.classList.remove('show');
        };
    </script>
</body>
</html>
